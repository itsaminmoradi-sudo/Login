<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        :root {
            --primary-color: #4a47a3;
            --secondary-color: #706fd3;
            --accent-color: #ff6b81;
            --light-grey: #f1f2f6;
            --dark-grey: #57606f;
            --white: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-grey);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--white);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
            text-align: center;
            padding: 40px;
        }

        .mascot {
            margin-bottom: 20px;
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid var(--light-grey);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--secondary-color);
        }

        p {
            color: var(--dark-grey);
            font-size: 14px;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
        }

        .mascot svg {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .mascot svg g {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }

        .mascot svg g.active {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mascot">
            <svg>
                <!-- Neutral State -->
                <g id="neutral" class="active">
                    <circle cx="100" cy="60" r="40" fill="#f0f0f0" />
                    <circle cx="85" cy="50" r="5" fill="#333" />
                    <circle cx="115" cy="50" r="5" fill="#333" />
                    <path d="M 80 70 Q 100 90 120 70" stroke="#333" stroke-width="3" fill="none" />
                    <line x1="100" y1="100" x2="100" y2="150" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="120" x2="70" y2="100" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="120" x2="130" y2="100" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="150" x2="80" y2="180" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="150" x2="120" y2="180" stroke="#333" stroke-width="3" />
                </g>
                <!-- Pointing State -->
                <g id="pointing">
                    <circle cx="100" cy="60" r="40" fill="#f0f0f0" />
                    <circle cx="85" cy="50" r="5" fill="#333" />
                    <circle cx="115" cy="50" r="5" fill="#333" />
                    <path d="M 80 70 Q 100 90 120 70" stroke="#333" stroke-width="3" fill="none" />
                    <line x1="100" y1="100" x2="100" y2="150" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="120" x2="70" y2="100" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="120" x2="130" y2="140" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="150" x2="80" y2="180" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="150" x2="120" y2="180" stroke="#333" stroke-width="3" />
                    <text x="135" y="150" font-size="12" fill="#333">Type it here!</text>
                </g>
                <!-- Shy State -->
                <g id="shy">
                    <circle cx="100" cy="60" r="40" fill="#f0f0f0" />
                    <path d="M 70 50 C 75 40, 95 40, 100 50" stroke="#333" stroke-width="3" fill="none" />
                    <path d="M 100 50 C 105 40, 125 40, 130 50" stroke="#333" stroke-width="3" fill="none" />
                    <path d="M 80 70 Q 100 80 120 70" stroke="#333" stroke-width="3" fill="none" />
                    <line x1="100" y1="100" x2="100" y2="150" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="150" x2="80" y2="180" stroke="#333" stroke-width="3" />
                    <line x1="100" y1="150" x2="120" y2="180" stroke="#333" stroke-width="3" />
                    <text x="50" y="20" font-size="12" fill="#333">Don't worry, I'm not looking!</text>
                </g>
            </svg>
        </div>
        <div class="form-container">
            <div id="login-form">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email or Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Log In</button>
                <p>Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            </div>
            <div id="signup-form" style="display: none;">
                <h2>Sign Up</h2>
                <input type="text" id="signup-username" placeholder="Username" required>
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <button type="submit">Sign Up</button>
                <p>Already have an account? <a href="#" id="show-login">Log In</a></p>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const showSignup = document.getElementById('show-signup');
            const showLogin = document.getElementById('show-login');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');

            const loginEmail = document.getElementById('login-email');
            const loginPassword = document.getElementById('login-password');
            const signupUsername = document.getElementById('signup-username');
            const signupEmail = document.getElementById('signup-email');
            const signupPassword = document.getElementById('signup-password');

            const neutralMascot = document.getElementById('neutral');
            const pointingMascot = document.getElementById('pointing');
            const shyMascot = document.getElementById('shy');

            showSignup.addEventListener('click', (e) => {
                e.preventDefault();
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            });

            showLogin.addEventListener('click', (e) => {
                e.preventDefault();
                signupForm.style.display = 'none';
                loginForm.style.display = 'block';
            });

            const setMascotState = (state) => {
                neutralMascot.classList.remove('active');
                pointingMascot.classList.remove('active');
                shyMascot.classList.remove('active');

                if (state === 'pointing') {
                    pointingMascot.classList.add('active');
                } else if (state === 'shy') {
                    shyMascot.classList.add('active');
                } else {
                    neutralMascot.classList.add('active');
                }
            };

            const inputs = [loginEmail, loginPassword, signupUsername, signupEmail, signupPassword];
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    if (input.type === 'password') {
                        setMascotState('shy');
                    } else {
                        setMascotState('pointing');
                    }
                });

                input.addEventListener('blur', () => {
                    setMascotState('neutral');
                });
            });
        });
    </script>
</body>
</html>
